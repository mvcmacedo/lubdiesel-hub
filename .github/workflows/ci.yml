name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lubdiesel
          POSTGRES_PASSWORD: lubdiesel
          POSTGRES_DB: lubdiesel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lubdiesel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://lubdiesel:lubdiesel@localhost:5432/lubdiesel_test?schema=public
      JWT_SECRET: ci-access-secret-min-32-characters-long
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters-long
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 4
      FRONTEND_URL: http://localhost:3000
      LOG_LEVEL: warn
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
      SEED_ADMIN_EMAIL: admin@lubdiesel.com.br
      SEED_ADMIN_PASSWORD: ChangeMe123!
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run prisma:generate -w @lubdiesel/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Apply migrations & seed
        run: |
          npm run prisma:deploy -w @lubdiesel/api
          npm run db:seed -w @lubdiesel/api

      - name: E2E tests
        run: npm run test:e2e -w @lubdiesel/api
